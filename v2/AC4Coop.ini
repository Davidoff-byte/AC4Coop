; AC4Coop v2 - the whole shipping config (docs/v2/ARCHITECTURE.md s4). Every key, its default and its evidence are in
; v2/core/config.cpp; the values below ARE the defaults, so a missing key changes nothing. Unknown keys are ignored.

[Display]
Fullscreen=0
Borderless=0

[Launcher]
; 1 = stay inert unless started by the co-op launcher (AC4Coop.armed younger than ArmWindowSec)
RequireArm=0
ArmWindowSec=300

[Boot]
MultiInstance=1
SkipIntroVideos=1
AutoContinue=1
AutoContinueSlot=-1
NoPause=1

[Net]
Mode=manual
PeerIP=127.0.0.1
PeerPort=47801
LocalPort=47801
BindIP=
JoinCode=

[Coop]
Players=2
Avatar=1
Guards=1
Combat=1
AiShips=1
PeerShip=1
Naval=1
Boarding=1
WorldTime=1
; 0 = the guest declines its own naval spawns inside the shared area (every AI ship there is a host ship)
GuestShipTraffic=0
PuppetDelayMs=100
GuardDelayMs=150
AiShipDelayMs=400
PeerShipDelayMs=250
SyncRadiusM=60
ShipSyncRadiusM=1000
AlertIds=8,257

[Log]
; 0 debug, 1 info, 2 warn, 3 error
Level=1

[Pilot]
; DevTools build only (tools/pilot.py)
Enabled=0
KeepFocus=0
PadIndex=0
