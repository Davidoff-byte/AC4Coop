[Display]
; Fullscreen=0 -> windowed (recommended for two-instance co-op testing)
; Fullscreen=1 -> leave the game in its normal fullscreen mode
Fullscreen=0
; Borderless applies only when windowed. 0 = bordered window, 1 = borderless (WS_POPUP)
Borderless=0
; How long (ms) to keep re-asserting windowed after attach, to beat the engine's command-line
; parse/display init. Increase if the game boots slowly and still starts fullscreen.
ForceWindowedMs=0

[Coop]
FightIntents=1
GuardActionLane=1
AttackForward=1
CoordSync=1
ShipSync=1
ShipGhost=1
ShipMirror=0
ShipClassBind=2
SpawnKeyBind=1
ShipPeerZ=1
ReleaseStaleGuard=0
GuardInterpBuffer=1
OwnUpdateGuards=1
PuppetUpdatePhysics=1
PuppetChannels=0
PuppetFightCarry=2
BrainBlockSync=1
BrainPathSetMs=150
BrainPathAuthority=1
BrainReact=1
BrainEnterProbe=1
BrainPuppet=0
BrainPlayoutMs=80
BrainChartSync=1
BrainHitSync=1
Brain115Suppress=1
Brain=1
PeerClock=1
; AiOffProbe (default 0) - MEASUREMENT ONLY. On the co-op copy (one character already in the world) it
; performs the minimal documented disable of the decision sub-object, CharacterBehavior+0x24 vtbl+36(0),
; the call 0x54DFA0 makes, then logs cnt=*(u16*)(helper+0x106) and the node/leaf before and after.
; One shot per process; no VA is patched and no other flag is touched. See
; ops/evidence/ai-off-seam-2026-11-21.md sections 5 and 7. Leave at 0 unless running that measurement.
AiOffProbe=0
; BoardObjectiveSync (default 0) - host -> guest sync of the six GcLBoardingBattle battle objectives
; (BattleObjective::State, uint32 at +0x04 of each pointer at +0x60..+0x74). Apply is a raw store: the class
; has no setter, it writes +0x04 itself at 0x14AA033 / 0x14AA0F6 (ops/evidence/battle-objective-state-
; 2026-11-21.md sections 3-5). The guest re-reads the slot immediately and 2 s later and logs
; `[CoordS] obj slot=... before= applied= after= after2s=` plus ok/stale/revert/bad, because whether such a
; store survives its monitors is unproven. Requires CoordSync=1; 0 = not a single extra read.
BoardObjectiveSync=1
; Entity relevance (Phase 1): replicate an NPC if it is within 80 m of YOUR player, or within
; RelevanceRadiusM metres of the PEER. Ships use their own (wider) radius. 0 = no filter.
RelevanceRadiusM=250
ShipRelevanceRadiusM=1000
; Phase 1 puppet spawn (press F6 in-game). 0 = build entity only + log (safe verification).
; 1 = also add to world, position at player+2m, and RegisterPlayer(pad=1).
IntegratePuppet=1
; Additionally bind the puppet to pad 1 (RegisterPlayer). Test visibility first (0), then try 1.
RegisterPad1=1
; The player's EntityBuilder is released after spawn; reload it by ID before building. 1 = on.
ReloadBuilder=0
; Replicate the player's locomotion state (speed/heading) onto the puppet so it walks/runs in sync.
DriveLocomotion=1
; Replicate the active Human CONTEXT (parkour/climb/wall-run/jump/swim), not just ground locomotion.
; Makes the puppet enter the peer's current context so its animation statechart plays the right move
; while the transform is synced. 1 = on, 0 = ground only. Experimental - A/B this if a move looks wrong.
; NOTE: for the braindead T-Pose baseline (DriveActions=0) keep this 0.
DriveContext=0
; Which contexts the puppet is ALLOWED to enter (bitmask, bit N = context id N; hex or decimal).
; The target-needing parkour contexts (Ladder=5, Ledge=7, Walling=8, NarrowObject=9, Climbing=30,
; Hanging=31, Boat=11) CRASH the engine's later update on a teleported puppet, so they are OFF by
; default. Only InAir=6 and Swim=10 are self-contained and safe: default 0x440 = (1<<6)|(1<<10).
; Ground=2 is always allowed. A disallowed context just keeps the puppet on the ground (no crash).
; Set 0xFFFFFFFF to allow everything (WILL crash on wall/ledge parkour - for testing the real fix only).
DriveContextMask=0x440
; Replicate the peer's current ACTION (animation clip) directly onto the puppet via SetTargetAction, so
; it animates like the peer regardless of context (universal anim sync). 1 = on, 0 = off. Read at startup.
; With DriveActions=0 AND DisablePuppetAI=1 the puppet is fully braindead: ActionComponent disabled ->
; T-Pose, position/orientation synced only (baseline, confirmed). DriveActions=1 = action replication
; (play the peer's real action clips) — the working mode. Keep DriveContext=0 in this mode.
DriveActions=1
; Disable the puppet's own behavior component so its statechart stops issuing its own actions/physics that
; fight our sync (was causing jitter + crashes). Makes the puppet a pure playback dummy. 1 = on (recommended
; with DriveActions), 0 = leave the puppet's AI running.
; NOTE: overridden per-context when HybridLoco=1 (see below).
DisablePuppetAI=1
; HybridLoco: per-context action ownership (fixes locomotion gait without the concurrent-action crash).
; The crash happens when the game and we play an action at the same time from different threads, so we keep
; EXACTLY ONE action-writer at all times:
;   - GROUND context: the puppet's OWN FSM owns actions (behavior ENABLED, we only feed HumanGroundData,
;     we never SetTargetAction) -> real walk/jog/run gait, like the early MVP.
;   - every OTHER context (jump/climb/swim/combat): WE own actions (behavior DISABLED + action replication).
; Behavior is toggled at the boundary with a short cooldown so the two owners never overlap in one frame.
; 1 = hybrid (recommended). 0 = old global-flag behavior (DisablePuppetAI/DriveActions above) for A/B.
HybridLoco=1
; NOTE (2026-11-15): HybridLoco's GROUND branch tests context id 2, but a real peer on the ground sends 4
; (ContextID_Ground; 2 = NOT_DEFINED), so with real packets the puppet always takes the OTHER branch.
; NativeReplica (R3, docs/design/native-replica.md): on the ground (context 4) the puppet is a native replica:
; behavior ENABLED, its character controller moves it, we steer it toward the peer with the peer's locomotion
; intention, and teleport only when the error exceeds NativeReplicaSnapCm. Off the ground: the path above.
; NativeReplicaBlendCmS: max blended position correction toward the peer (cm/s, 0 = off).
; NativeReplicaStartBoostCmS: higher correction cap while the replica is still accelerating behind a moving peer
; (cm/s, 0 = off; visible as a short slide at run starts).
; 0 = off (default, until verified live).
NativeReplica=1
NativeReplicaSnapCm=300
NativeReplicaBlendCmS=150
NativeReplicaStartBoostCmS=400
; NativeReplicaParkour (R4.1, docs/design/player-decisions-r4.md): also keep the native replica in the peer's
; parkour contexts and follow by navigation (3D target, ChaseHigh); teleport only when the 3D error exceeds
; NativeReplicaParkourSnapCm or stays above 2.5 m for 4 s. Needs NativeReplica=1. 0 = off.
NativeReplicaParkour=1
NativeReplicaParkourSnapCm=800
; NativeReplicaFreeRun (R4.3 feasibility): also feed the replica's IHumanGround with the peer's free-run state
; (movement type, sprint) and direction each frame. Experimental, 0 = off.
NativeReplicaFreeRun=1
; NativeReplicaClimbIntent: while both climb, steer the replica's climbing sequencer toward the peer (climbing
; interface slots 37/38). Experimental, 0 = off. On the sender it also carries the player's real climbing input in
; PlayerState's context block (ClimbBlock, contextId 30); the replica prefers that input over the error-derived one.
NativeReplicaClimbIntent=1
; NativeReplicaClimbMoves: with NativeReplicaClimbIntent, the replica follows the peer's climbing moves hold by hold
; (hand targets of each peer move) instead of its stick input. Re-read every 2 s. Experimental, 0 = off.
NativeReplicaClimbMoves=1
; NativeReplicaClimbChoice: with NativeReplicaClimbMoves, the replica's shimmy creator takes the candidate nearest the
; peer's hold (hook on the candidate generator 0x01B509A0). Re-read every 2 s. Experimental, 0 = off.
NativeReplicaClimbChoice=0
; NativeReplicaBeam: while the replica is on a beam (context 9) and the peer is not, steer it toward the peer
; (NarrowObject interface slots 0/1). Re-read every 2 s. Experimental, 0 = off.
NativeReplicaBeam=0
; NativeReplicaWallEntry: the replica starts its wall run where the peer started its own (last ground position before
; Walling), in the peer's direction; it navigates there first. Re-read every 2 s. Experimental, 0 = off.
NativeReplicaWallEntry=1
; NativeReplicaClimbNoSnap: no stuck-snap (4 s > 2.5 m) while the peer is on a wall (contexts 7/8/30/31); the far snap
; (NativeReplicaParkourSnapCm) stays. Re-read every 2 s. Experimental, 0 = off.
NativeReplicaClimbNoSnap=1
; SeekOnSwitch: when the puppet switches action, seek the new clip to the peer's playback phase instead of
; starting at frame 0. 1 = on. Set 0 to A/B if transitions look snappy (the seek may also advance the blend).
SeekOnSwitch=1
; MinBlendInMs: when the peer switched action with NO blend (e.g. a transition clip handing off to its target),
; the puppet blends this long instead of hard-cutting, to hide network timing. 0 = copy the cut exactly.
MinBlendInMs=100
; Suppress ALL ambient entity spawning (pedestrians, guards, other NPCs, ships) so both clients show
; the same empty world - un-synced ambient entities are seeded independently per client. Hooks the
; universal SpawningRequest::Spawn to decline every spawn (plus a crowd-source hook). Existing entities
; clear out as they leave. 1 = no ambient spawns, 0 = normal. Read once at startup.
DisableSpawns=0

; Null/stale target guards (DerefGuard). Both default 1 and are independent:
;   GuardNullTarget=1 GuardStaleTarget=0  -> exactly the previous build's behaviour (A/B baseline)
;   GuardNullTarget=0 GuardStaleTarget=1  -> stale-target guard alone
; GuardNullTarget: the six per-site null guards on [node+0x114] / [node+0x118] (sub_679750 / sub_681980).
; GuardStaleTarget: validates the object loaded at 0x006795FD -- non-null, plausible pointer, and a
; vtable inside .rdata -- before the engine's unchecked virtual call (the 0x0073448F / EDX=0xFFFFFFFF
; crash). A rejected pointer takes the engine's own "no target" path at 0x00679611.
GuardNullTarget=1
GuardStaleTarget=1
; FixNullReturn: wraps the sub_733FB0 CALLER at 0x006817FA in sub_6817C0. sub_733FB0 returns NULL by
; design (state not 4/5, or state 5 with a missed lookup) and the engine's own NULL path jumps straight
; into `movzx ecx,[edi+0x2B6]` with edi == 0. The call becomes a jump to a 19-byte trampoline that
; re-issues the call and, on NULL, leaves through the function's own epilogue (0x006818E6). No deref
; site is modified. 1 = on (default), 0 = leave the raw call (A/B baseline). Read once at startup.
FixNullReturn=1

; WalkNullGuard (default 1 = ON): null guard on the world-update walk's two leaves, 0x0075A1F0 and
; 0x0075A1B0. sub_4AD990 loads L = [edi+4] ONCE per walk and passes the same ecx to both; when L == 0
; the leaf faults at 0x0035A1F8 (`mov ecx,[ecx+0A0h]`). Both entries are detoured (8-byte prologue
; re-executed on the non-null path, so behaviour is identical); ecx == 0 returns via `xor eax,eax; ret 4`
; -- the original `pop ebp; retn 4` minus the EBP push. Logs one `[WalkGuard] installed ...` line and
; `[WalkGuard] null L hit n=.. (first at t=..)` at most once per second. 0 = nothing patched.
; While this is 1, ProxySkipWalk's [U+0x159] write is not made (it kills the whole view's render);
; ProxySkipWalk=1 with WalkNullGuard=0 keeps that path as a documented alternative for A/B.
WalkNullGuard=1

; NullReturnObserver (default 1 = ON): READ-ONLY, changes no behaviour. Detours sub_733FB0 itself
; (9-byte prologue: `mov eax,ecx; movzx ecx,[eax+0D4h]`) and, after it returns, logs the caller's
; return address when EAX == 0:
;   [NO] observer installed @ 0x733FB0 (steal=9, tramp=0x........)
;   [NO] null return -> caller 0x006817FF (n=1)
; Distinct callers are remembered (up to 64, each with a running count); after that only the total is
; counted and `[NO] caller table full` is logged once. Logging stops after 2000 null returns with
; `[NO] cap reached (2000)`; the detour stays installed because it is cheap and read-only. Use it to
; find the OTHER callers of sub_733FB0 that still dereference a NULL result. 0 = not installed.
NullReturnObserver=0

; TransformProbe (default 0 = OFF): READ-ONLY diagnostic, changes no behaviour and nothing on the wire.
; Every 30 frames it appends, to phase1_log_<pid>.txt, the four documented transform sources for the
; local player and the puppet (if one exists):
;   wire  = Entity+0x10 m_GlobalMatrix (what the snapshot sends today, suspected stale)
;   cc1A0 = CharacterController+0x1A0      cc1C0 = CharacterController+0x1C0
;   node  = [[CharacterController+0x510]+0x00..0x3F]  (the composed node matrix)
; plus a `valid` line saying which pointers were actually readable. One run with this on decides which
; source is live (Entity+0x40 has no per-frame writer; 4.83 m peak peer-position error observed).
; It only reads memory; it never writes engine memory, calls a setter, or allocates.
TransformProbe=0

; IdentityBand (default 0 = OFF): READ-ONLY diagnostic for the two-machine weekend run. Once per
; second it appends, to the phase1 log, the local player's own entity plus the 32 nearest entities
; within 30 m (nearest first):
;   [IB] f=<frame> n=<count>
;   [IB]   1 ent=0x.. h=0x.. reg=.. id=0x....  band=portable|minted|null d=<metres>
; `band` is minted for ids >= 0xF0000000 (local mint counter, NOT wire-portable), portable for
; ids < 0xF0000000 (nonzero), null for 0 / 0xFFFFFFFF. The distance is what lets a human pair the
; same NPC across the two logs positionally.
; Works with EntitySync=0: it is not gated on the entity lane or on EntityHost.
; It only reads memory and calls the read-only id thunk (arg_4=0 gates minting); it never writes
; engine memory, allocates, or changes behaviour.
IdentityBand=0

; CombatTest (default 0 = OFF): single-player GO/NO-GO experiment for combat sync, NOT a combat-sync
; feature. With 1, press F15 in game: the plugin takes the nearest LIVE guard-type entity within 25 m
; of your player, logs its entity pointer / object id / handle / distance, reads its health service,
; applies the engine's own dead encoding to that service (Life u16 @+0x5C := 0xFFFF and
; Flags u32 @+0x60 |= 0x01000000 - the same two writes the user-verified reference implementation
; used), and then watches that same object every 0.5 s for 10 s. Nothing is sent on the wire and no
; engine method is called. One press = one guard; a second press during the window is ignored.
;   [CT] target ent=0x........ id=0x........ h=0x..... d=..
;   [CT] before alive=1 hp=150.0
;   [CT] applied write=1 after_alive=0 hp=65535.0
;   [CT] t=0.5 alive=0 hp=65535.0 ... [CT] t=10.0 ...
;   [CT] RESULT stayed_dead=1 resurrected=0 lost=0     <-- the answer line
; hp is the raw Life field, so 65535.0 means "dead encoding". lost=1 means the entity or its service
; went unreadable mid-window (despawned, freed or recycled) - the verdict is then inconclusive.
; F15 was chosen because F1-F14 and V are already bound (F1 guard/health map, F2 health scan,
; F3 input, F4 entity enum, F5 ship drive, F6 spawn, F7 dump, F8 crowd, F9 scene, F10 ship,
; F11 ghost despawn, F12 ship ctor, F13 ship drive, F14 enum alias).
; Do NOT press this on a guard a mission script owns; killing one can break that objective.
CombatTest=0

; WatchTarget (default 0 = OFF): Ctrl+Alt+J. READ-ONLY. Logs the addresses of the nearest soldier within
; 25 m of the player - nothing is written, nothing is sent, no trap is installed:
;   [TD] ent=%08X health=%08X svc=%08X svcFlags=%08X life=%u/%u flags=%08X
; ent      = the Entity.                          health = its CSrvNPCHealth (vtable 0x02712F60).
; svc      = sub_10EF8C0(ent), the is-alive service whose +4 word holds the combat-dead bit 0x1000.
; svcFlags = *(u32*)(svc+4).                      life/maxLife = u16 health+0x5C / +0x5E.
; flags    = u32 health+0x60.
; This is the line you paste into a debugger: set a breakpoint on the code that writes svc+4, or use
; Cheat Engine's "find what writes this address" with svc+4. Nothing else happens, so it is safe to press.
WatchTarget=0

; WatchDeadBit (default 0 = OFF): Ctrl+Alt+L. Same lookup as above, but then arms a PAGE_GUARD on the
; page holding svc+4. PAGE_GUARD is process-wide, so unlike a debug-register breakpoint it catches the
; Scimitar job threads that actually write the bit. Only accesses inside [svc+4, svc+8) are reported;
; every other access to the page is silently re-armed. Press again (after 2 s) to disarm.
;   [WB] armed svc=%08X page=%08X (flags now %08X) - now KILL that guard normally
;   [WB] hit eip=%08X addr=svc+%X val=%08X
;   [WB] caller=%08X            (x4: EBP chain return addresses)
;   [WB] disarmed after %d hits, %d distinct eip(s)
; The trap stops itself after 2000 guard-page exceptions, on the third distinct writer EIP, or if the
; guarded page turns out to hold the faulting code. If the page is busy the game will visibly slow down
; while armed - that is expected and bounded; press Ctrl+Alt+L again to stop early.
; It mutates one page's protection bits and nothing else: no engine call, no engine memory write.
WatchDeadBit=0

; ---- Stage 2A combat observer (E2-combat.md §1.2) -------------------------------------------
; 0 = off (default). 1 = install four prologue byte-patch hooks on
; 0x17106C0 / 0x173E190 / 0x19FB4C0 / 0x133F550 and write one
;   [CO] site=<n> eip=<addr> this=<ptr> a2=<ptr> a3=<ptr>
; line per hit. Each site's whole-instruction prologue (6/6/6/7 bytes) is replaced with a JMP to a
; private stub that logs the call arguments, re-executes the stolen bytes and jumps back; the exact
; original bytes are restored on detach. Thread-agnostic: one patch covers every thread.
; OBSERVATION ONLY: no engine function is called, no engine state is read or written, and the
; arguments are logged as values, never dereferenced, so it cannot change combat behaviour.
; Capped at 5000 log lines, with the first 100 lines per site reserved so one hot site cannot
; starve the others. Each site's 16/24-byte pattern is re-verified by memcmp at install; a mismatch
; is logged with the expected/actual bytes and that site is skipped -- never patched blind.
; With this at 0 the unit reads this one value and returns: no log file, no allocation, no patch.
CombatObserve=0
; ---- proto 15 intention lane (docs/design/intention-lane.md) -----------------------------------
; 0 = off (default): the lane is idle and received 'AC4I' datagrams are ignored. 1 = reliable, ordered,
; deduplicated per-guard intention messages with the last value per (guard, channel) replayed to a new or
; rejoined peer. Transport only: nothing publishes or applies intentions yet (phase1.cpp is not wired).
; Both peers must run proto 15 either way; the flag only decides whether the lane carries traffic.
IntentLane=1
; ---- guard placement on the guest (docs/design/enemy-placement.md) --------------------------------------
; GuardPlace: 1 = each linked guard body is written by ONE writer, on its own update, every frame, from the host's
; timestamped snapshot ring (no per-packet hop, clean link reset, gaps closed from the body at <= 0.4 m per write,
; recycled bodies released). Best with EntityFrameCadence=1 (true 20 Hz). 0 = per-packet writes (default).
GuardPlace=0
; BindFarRadiusM: > BindRadiusM adds a third bind round up to this radius, only for pairs whose body and host guard
; are both >= BindHideM from the guest player. 0 = off (default).
BindFarRadiusM=0
BindHideM=35

; ---- [Coop] ShipTuning (default 0) --------------------------------------------------------------
; LOCAL, per-ship ship-AI tuning. No network traffic: the CF_TUNE_* field ids exist in coord_sync.h so a
; future sync lane can reuse them, but nothing publishes them in this build.
; The values live in ShipAIDetection, embedded twice in ShipAIDetectionSettings (Day at +0x8,
; HighSecurityZone at +0x40). ShipTuning=1 alone does nothing without Probe or Apply.
; Evidence: ops/evidence/ship-tuning-2026-11-21.md.
;
; ShipTuning=1 turns the lane on at all. With 0 (default) there is no coord walk, no read, no log.
ShipTuning=1
; ShipTuningProbe=1 (default) logs one line per GcLShip per 10 s, and writes nothing:
;   [Tune] ship=%016llX cached=%p override=%p block=%p hsz=%d sharedDefault=%d
; cached   = GcLShip+0x148 (the per-ship settings object)
; override = GcLShip+0x14C (the weak-owner handle that WINS over +0x148 when valid)
; block    = the pointer the engine would read: base+0x8 (Day) or base+0x40 (HSZ)
; sharedDefault=1 means a write there would hit shared data: the block resolves to the image override
; (0x04DD5F8C), or any pointer on the way is inside the exe image (0x00400000-0x00E00000), or another
; ship in the same pass resolved to the same object. THE ANSWER TWO SHIPS GIVE HERE IS THE POINT: two
; ships of one archetype reporting different `cached=` pointers = per-instance; identical = per-archetype.
ShipTuningProbe=1
; ShipTuningApply=1 (default 0) writes the Tune* values below into every GcLShip whose block is NOT
; sharedDefault. Shared ships are skipped with one
;   [Tune] refuse key=%016llX reason=shared-default
; line per ship. Every applied field is re-read in the same tick and logged:
;   [Tune] apply key=%016llX field=Day.DetectionConeAngle before=120.000 wrote=140.000 after=140.000
; The detection floats are plain data (both engine readers found are pure getters), so a write is
; expected to stick; `after` differing from `wrote` says otherwise. All four fields are written into BOTH
; blocks, because the Day/HSZ selector (+0x3AF) can flip later and the tune should survive the flip.
ShipTuningApply=0
; Tuning values. OMIT a key to leave that field untouched; there is no implicit 0.
; Units are [UNPROVEN] - these are the raw floats the engine stores, not converted here. The live values
; are cone angle 120, range 350, max time 30, aggro time 30 (ship-fields-live-2026-11-16.md:15).
TuneConeAngle=120
TuneConeRange=350
TuneMaxTime=30
TuneAggroTime=30
; TuneHull > 0 also sets HullHealth (GcLShip+0xD0) - through the engine setter 0x01225A10, never a raw
; store, because the setter mirrors +0x520 and recomputes the damage tier. 0 = leave the hull alone.
; Note the hull is reverted by the engine's own regeneration path, so a value set here can drain back.
TuneHull=0

